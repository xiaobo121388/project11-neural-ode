name: Windows Build and Regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install stable Rust checks
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Record compiler
        run: rustc --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Unit and integration tests
        run: cargo test --locked
      - name: Headless core tests
        run: cargo test --locked --no-default-features
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rustdoc
        run: cargo doc --locked --no-deps
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install independent benchmark requirements
        run: python -m pip install -r scripts/requirements.txt
      - name: Build and package Windows demo
        run: ./scripts/package_windows.ps1
      - name: Generate shared one-epoch parity fixture
        run: |
          ./target/release/project11.exe generate --out "$env:RUNNER_TEMP/p11"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/project11.exe benchmark --out "$env:RUNNER_TEMP/p11" --epochs 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/benchmark_numpy.py --root "$env:RUNNER_TEMP/p11"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: WindowsDemo
          path: dist/WindowsDemo/
          if-no-files-found: error
