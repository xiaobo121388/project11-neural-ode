[package]
name = "project11"
version = "0.1.0"
edition = "2024"
description = "Hand-written neural network surrogate for pendulum dynamics"
license = "MIT"
default-run = "project11"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_extras", "dep:image"]

[[bin]]
name = "pendulum-lab"
path = "src/bin/pendulum_lab.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
ndarray = { version = "0.17", features = ["serde"] }
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"], optional = true }
egui_extras = { version = "0.33", default-features = false, features = ["svg"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
